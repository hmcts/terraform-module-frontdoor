name: WAF exclusions

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  waf-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -backend=false -input=false
      - run: terraform test -filter=tests/waf_exclusions.tftest.hcl
